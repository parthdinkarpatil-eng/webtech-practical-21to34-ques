<!DOCTYPE html>
<html>
<head>
    <title>3-Digit Armstrong Numbers</title>
</head>
<body>

<h2>3-Digit Armstrong Numbers</h2>

<div id="output"></div>

<script>
    let result = "";

    for (let num = 100; num <= 999; num++) {

        // extract digits
        let a = Math.floor(num / 100);        // hundreds
        let b = Math.floor((num % 100) / 10); // tens
        let c = num % 10;                     // ones

        // calculate sum of cubes
        let sum = (a ** 3) + (b ** 3) + (c ** 3);

        // check Armstrong condition
        if (sum === num) {
            result += num + "<br>";
        }
    }

    document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
